[project]
name = "elastic-wave-propagate-on-the-2d-plate"
version = "0.4.1"
description = "Energy-form 2D elastic wave simulation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
	"matplotlib",
	"scikit-fem",
	"scipy",
	"numpy",
	"Pillow",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff.lint.per-file-ignores]
# Entry scripts add src/ to the import path before importing application modules.
"run.py" = ["E402"]
"run_compare.py" = ["E402"]
"src/compare.py" = ["E402"]
"test/*.py" = ["E402"]
"validation/*.py" = ["E402"]

[tool.ruff]
extend-exclude = ["notebooks"]
cache-dir = "feedback/.ruff_cache"

[tool.pytest.ini_options]
cache_dir = "feedback/.pytest_cache"
